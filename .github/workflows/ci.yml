
name: MedLink CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main", "feature/**" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x] # Utilise Node 18

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Utilisation de Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # --- BACKEND ---
      - name: Installation des dépendances Backend
        working-directory: ./backend
        run: npm ci

      - name: Vérification de la syntaxe / Build Backend (si script défini)
        working-directory: ./backend
        run: npm run build --if-present || echo "Pas de script build, passage à la suite"

      # --- FRONTEND ---
      - name: Installation des dépendances Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Build du Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: ✅ Succès du pipeline CI
        run: echo "Le code compile avec succès pour le frontend et le backend !"
