services:
  jenkins:
    build: .
    container_name: medlink-jenkins
    user: root            # lab : accès au socket Docker
    ports: ["8080:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
  sonarqube:
    image: sonarqube:community
    container_name: medlink-sonarqube
    ports: ["9000:9000"]
    volumes:
      - sonar_data:/opt/sonarqube/data
volumes:
  jenkins_home:
  sonar_data:
