services:
  # 1. Base de données
  db:
    image: postgres:16-alpine
    container_name: medlink-db
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink_secret
      POSTGRES_DB: medlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (Node.js)
  backend:
    build: ./backend
    container_name: medlink-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # Variables lues par ton db.js
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=medlink
      - DB_PASSWORD=medlink_secret
      - DB_NAME=medlink
      - JWT_SECRET=ton_super_secret_jwt
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: medlink-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
