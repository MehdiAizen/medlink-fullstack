version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medlink-db
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink_secret
      POSTGRES_DB: medlink
    ports:
      - "5432:5432"
    volumes:
      - medlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U medlink -d medlink" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medlink_pgdata:
