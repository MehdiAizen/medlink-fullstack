services:
  # 1. Base de données
  db:
    image: postgres:16-alpine
    container_name: medlink-db
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink_secret
      POSTGRES_DB: medlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (Node.js)
  backend:
    build: ./backend
    container_name: medlink-backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: medlink-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 4. Keycloak (Identity and Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: medlink-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped     

volumes:
  postgres_data:
  keycloak_data:

  
