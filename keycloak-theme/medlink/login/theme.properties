# Thème de connexion MedLink : hérite du thème officiel keycloak.v2
# et ne fait qu'ajouter notre feuille de style par-dessus.
parent=keycloak.v2
# css/styles.css = feuille du thème parent (à garder), css/medlink.css = la nôtre
styles=css/styles.css css/medlink.css
# Thème clair uniquement (cohérent avec le site, quel que soit le mode du navigateur)
darkMode=false
