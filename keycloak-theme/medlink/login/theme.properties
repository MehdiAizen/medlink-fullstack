# Thème de connexion MedLink : hérite du thème officiel keycloak.v2
# (template.ftl et login.ftl sont copiés de Keycloak 26.8.2 puis adaptés : à revoir si on change de version).
parent=keycloak.v2
styles=css/styles.css css/medlink.css
scripts=js/medlink.js
darkMode=false
locales=fr,en

# Adresse du formulaire d'inscription du site (lien « Créer un compte patient » sous le formulaire).
# En local : http://localhost:3000/signup. À changer pour un serveur de test/production.
signupUrl=http://localhost:3000/signup
homeUrl=http://localhost:3000/

# Formulaire d'inscription praticien : cette page n'existe pas encore dans le frontend (à créer par l'équipe).
# Tant qu'elle n'existe pas, le lien renvoie vers l'accueil du site.
practitionerSignupUrl=http://localhost:3000/signup-practitioner

# Liens du pied du panneau de gauche (à renseigner quand ces pages existent)
legalUrl=#
privacyUrl=#
